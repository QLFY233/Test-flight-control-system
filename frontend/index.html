<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0A0A0A">
    <title>试飞控制系统</title>
    <meta name="description" content="Tactical Flight Telemetry & Control Interface — Industrial Brutalist Terminal">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" defer></script>
</head>
<body>
<div id="app"><div id="step" style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0A0A0A;color:#FF2A2A;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.15em;flex-direction:column;gap:8px;text-transform:uppercase;">[ SYS_INIT ] 加载中...</div></div>
<script>
window.__app = {};
var stepEl = document.getElementById('step');
function step(s, c) { stepEl.textContent = '[ ' + s + ' ]'; if (c) stepEl.style.color = c; }
var _log = console.log.bind(console);
console.log = function() { step(Array.from(arguments).join(' '), '#FF2A2A'); _log.apply(console, arguments); };
window.onerror = function(m,s,l) { step('ERR: ' + m + ' @L' + l, '#FF2A2A'); return false; };
window.addEventListener('unhandledrejection', function(e) { step('REJECT: ' + (e.reason?.message||e.reason), '#FFB300'); });
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
